{{- $fullname := include "llm-platform.fullname" . -}}
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "llm-platform.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-dashboard
  labels:
    {{- include "llm-platform.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  llm-platform.json: |-
{{ .Files.Get "dashboards/llm-platform.json" | indent 4 }}
{{- end }}
