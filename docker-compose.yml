# Local stack without Kubernetes. Untested here (the build machine has no Docker).
#   docker compose up --build                       gateway + mock models + Qdrant + Prometheus + Grafana
#   docker compose --profile vllm up                 also start vLLM on CPU (downloads the model)
#   LLMPLAT_VECTOR_STORE=pgvector docker compose --profile pgvector up
services:
  gateway:
    build: .
    environment:
      LLMPLAT_CONFIG: config/compose.yaml
      LLMPLAT_VECTOR_STORE: ${LLMPLAT_VECTOR_STORE:-qdrant}
    ports: ["8080:8080"]
    volumes: ["registry:/data"]
    depends_on: [qdrant, mock-small, mock-large]

  mock-small:
    build: .
    command: ["mock-backend", "--name", "local-small", "--port", "8000"]
  mock-large:
    build: .
    command: ["mock-backend", "--name", "hosted-large", "--port", "8000"]

  vllm:
    profiles: [vllm]
    image: vllm/vllm-openai-cpu:v0.31.0
    command: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--served-model-name", "qwen2.5-0.5b", "--max-model-len", "4096", "--enable-prefix-caching"]
    environment: {VLLM_CPU_KVCACHE_SPACE: "2"}
    shm_size: 1g
    ports: ["8000:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  pgvector:
    profiles: [pgvector]
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_USER: llmplat, POSTGRES_PASSWORD: llmplat, POSTGRES_DB: llmplat}
    ports: ["5432:5432"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/llm-platform/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  registry: {}
  qdrant: {}
  hf-cache: {}
