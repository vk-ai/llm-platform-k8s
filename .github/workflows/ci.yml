name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (offline; mock backends, in-memory Qdrant; pgvector and live tests skip)
        run: pytest -q --cov=llm_platform --cov-report=term
      - name: Demo run
        run: python demo/run_demo.py

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: llmplat
          POSTGRES_PASSWORD: llmplat
          POSTGRES_DB: llmplat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmplat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGVECTOR_DSN: postgresql://llmplat:llmplat@localhost:5432/llmplat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,pgvector]"
      - name: pgvector tests
        run: pytest -q -m pgvector
      - name: Demo incl. pgvector section
        run: python demo/run_demo.py

  deploy-lint:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dashboard JSON is up to date
        run: |
          python scripts/build_dashboard.py
          git diff --exit-code deploy/helm/llm-platform/dashboards/
      - name: helm lint + kubeconform + terraform fmt/validate (nothing is applied)
        run: make lint
