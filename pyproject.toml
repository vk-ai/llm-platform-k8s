[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-platform-k8s"
version = "0.1.0"
description = "Small LLM platform on Kubernetes: vLLM serving via Helm/Terraform on kind, a FastAPI gateway with cost-based routing and prompt caching, a versioned prompt registry, pgvector/Qdrant RAG and Prometheus/Grafana dashboards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-cov>=5", "qdrant-client>=1.9"]

[project.scripts]
llm-platform = "llm_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pgvector: needs Postgres with the pgvector extension (set PGVECTOR_DSN)",
    "live: talks to a real OpenAI-compatible server (set LLMPLAT_REAL_BASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
